<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 번째 웹 페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 56px 64px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 2.4rem;
      color: #3b2d6e;
      margin-bottom: 14px;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: #6b6b8a;
      margin-bottom: 36px;
    }

    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    .result {
      margin-top: 28px;
      font-size: 1.15rem;
      color: #764ba2;
      font-weight: 600;
      min-height: 1.5rem;
    }

    footer {
      margin-top: 40px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>안녕하세요 👋</h1>
    <p class="subtitle">제 첫 번째 웹 페이지예요</p>
    <button onclick="showMessage()">눌러보기</button>
    <div class="result" id="result"></div>
  </div>

  <footer>LG U+ Lifestyle Innovation Workshop</footer>

  <script>
    function showMessage() {
      document.getElementById('result').textContent = '🎉 잘 작동해요!';
    }
  </script>

</body>
</html>
