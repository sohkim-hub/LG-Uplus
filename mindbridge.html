<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음다리 — 스탠퍼드 대학원생 마음 돌봄</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cardinal:   #8C1515;
      --cardinal-lt:#B83A3A;
      --sand:       #F4F0E8;
      --sand-dark:  #E8E2D5;
      --surface:    #FFFFFF;
      --text:       #1C1C1E;
      --muted:      #6E6E73;
      --border:     #E5E5EA;
      --user-bg:    #8C1515;
      --bot-bg:     #F2F2F7;
      --radius-lg:  18px;
      --radius-sm:  12px;
      --shadow:     0 8px 32px rgba(0,0,0,0.10);
    }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: var(--sand);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top Bar ── */
    .topbar {
      background: var(--cardinal);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(140,21,21,0.25);
    }
    .topbar-avatar {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .topbar-info { flex: 1; }
    .topbar-name { font-weight: 700; font-size: 0.97rem; }
    .topbar-status {
      font-size: 0.75rem;
      opacity: 0.85;
      display: flex; align-items: center; gap: 5px;
    }
    .dot-online {
      width: 7px; height: 7px;
      background: #34C759;
      border-radius: 50%;
      display: inline-block;
    }
    .topbar-actions { display: flex; gap: 10px; }
    .topbar-btn {
      background: rgba(255,255,255,0.15);
      border: none; color: white;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Mood Bar ── */
    .mood-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .mood-bar::-webkit-scrollbar { display: none; }
    .mood-label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 600;
      margin-right: 4px;
    }
    .mood-btn {
      border: 1.5px solid var(--border);
      background: white;
      border-radius: 50px;
      padding: 5px 13px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      color: var(--text);
    }
    .mood-btn:hover, .mood-btn.active {
      background: var(--cardinal);
      border-color: var(--cardinal);
      color: white;
    }

    /* ── Chat Window ── */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* Date divider */
    .date-divider {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-divider::before, .date-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Message row */
    .msg-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 82%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--cardinal);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: var(--radius-lg);
      font-size: 0.93rem;
      line-height: 1.55;
      position: relative;
    }
    .msg-row.bot  .msg-bubble {
      background: var(--bot-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 0.67rem;
      color: var(--muted);
      margin-top: 3px;
      display: block;
      text-align: right;
    }
    .msg-row.bot .msg-time { text-align: left; }

    /* Resource card inside bubble */
    .resource-card {
      margin-top: 10px;
      background: white;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      border-left: 3px solid var(--cardinal);
      font-size: 0.85rem;
      color: var(--text);
    }
    .resource-card strong { display: block; margin-bottom: 3px; font-size: 0.88rem; }
    .resource-card span { color: var(--muted); font-size: 0.8rem; }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: flex-start;
      padding-left: 38px;
    }
    .qr-btn {
      background: white;
      border: 1.5px solid var(--cardinal);
      color: var(--cardinal);
      border-radius: 50px;
      padding: 7px 15px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .qr-btn:hover {
      background: var(--cardinal);
      color: white;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      align-self: flex-start;
    }
    .typing-dots {
      background: var(--bot-bg);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: 4px;
      padding: 13px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input Bar ── */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .input-wrap {
      flex: 1;
      background: var(--bot-bg);
      border-radius: 22px;
      display: flex;
      align-items: flex-end;
      padding: 8px 14px;
      gap: 8px;
    }
    #userInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
    }
    #userInput::placeholder { color: #aaa; }

    .send-btn {
      width: 38px; height: 38px;
      background: var(--cardinal);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
    }
    .send-btn:hover { background: var(--cardinal-lt); transform: scale(1.07); }
    .send-btn:disabled { background: #ccc; cursor: default; transform: none; }

    /* ── Crisis Banner ── */
    .crisis-banner {
      background: #FFF3CD;
      border-top: 2px solid #FFC107;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: #856404;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .crisis-banner a { color: var(--cardinal); font-weight: 700; text-decoration: none; }

    /* Scrollbar */
    .chat-window::-webkit-scrollbar { width: 4px; }
    .chat-window::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    @media (max-width: 480px) {
      .topbar-actions { display: none; }
      .msg-row { max-width: 92%; }
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-avatar">🌉</div>
  <div class="topbar-info">
    <div class="topbar-name">마음다리 — 스탠퍼드 대학원생 마음 돌봄</div>
    <div class="topbar-status">
      <span class="dot-online"></span> 언제든 여기 있어요 · 비밀 보장
    </div>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="showResources()">📚 도움 자료</button>
    <button class="topbar-btn" onclick="showCrisis()">🆘 위기 상황</button>
  </div>
</div>

<!-- Mood Check-in -->
<div class="mood-bar">
  <span class="mood-label">지금 기분이 어때요?</span>
  <button class="mood-btn" onclick="selectMood(this, '압도감')">😰 너무 벅차요</button>
  <button class="mood-btn" onclick="selectMood(this, '불안감')">😟 불안해요</button>
  <button class="mood-btn" onclick="selectMood(this, '외로움')">🫂 외로워요</button>
  <button class="mood-btn" onclick="selectMood(this, '번아웃')">🔥 번아웃이에요</button>
  <button class="mood-btn" onclick="selectMood(this, '그냥 그래요')">😐 그냥 그래요</button>
  <button class="mood-btn" onclick="selectMood(this, '괜찮아요')">😊 괜찮아요</button>
</div>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
  <div class="date-divider">Today</div>

  <!-- Opening bot message -->
  <div class="msg-row bot">
    <div class="msg-avatar">🌉</div>
    <div>
      <div class="msg-bubble">
        안녕하세요. 저는 마음다리예요 — 스탠퍼드 대학원생을 위한 안전한 공간이에요. 💙<br><br>
        지도교수 스트레스, 임포스터 신드롬, 논문 불안, 새벽 2시의 외로움… 무엇이든 괜찮아요. 여기서 나누는 이야기는 비밀이 지켜져요.
      </div>
      <span class="msg-time">방금</span>
    </div>
  </div>

  <div class="quick-replies" id="initialQR">
    <button class="qr-btn" onclick="quickReply('지도교수 때문에 힘들어요')">😔 지도교수 문제</button>
    <button class="qr-btn" onclick="quickReply('내가 여기 있으면 안 될 것 같아요')">🧠 임포스터 신드롬</button>
    <button class="qr-btn" onclick="quickReply('완전히 번아웃 상태예요')">🔋 번아웃</button>
    <button class="qr-btn" onclick="quickReply('너무 외롭고 고립된 느낌이에요')">🫂 외로움</button>
    <button class="qr-btn" onclick="quickReply('논문 불안이 너무 심해요')">📝 논문 스트레스</button>
  </div>
</div>

<!-- Crisis Line -->
<div class="crisis-banner" id="crisisBanner" style="display:none">
  🆘 위기 상황이라면: <a href="tel:988">988 자살예방상담전화</a> ·
  <a href="tel:6507234357">Stanford CAPS: (650) 723-4357</a> ·
  <a href="#">위기문자: HOME → 741741</a>
</div>

<!-- Input -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="userInput" rows="1" placeholder="지금 마음속에 있는 이야기를 꺼내보세요…"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
  // ── Conversation Engine ──────────────────────────────────────────────────

  const RESPONSES = {
    advisor: {
      keywords: ['지도교수', '교수님', '어드바이저', '랩장', '지도', '교수'],
      replies: [
        {
          text: `지도교수 관계는 대학원 생활에서 정말 힘든 부분 중 하나예요 — 그 관계 하나가 모든 걸 좌우하기도 하죠.\n\n좀 더 얘기해줄 수 있어요? 피드백이 없는 건지, 소통이 안 되는 건지, 지지받지 못한다는 느낌인지, 아니면 다른 문제인가요?`,
          qr: ["피드백을 전혀 안 줘요", "교수님이 제 존재를 모르는 것 같아요", "권력 불균형이 심해요", "제 아이디어를 무시해요"]
        },
        {
          text: `지도교수 관계는 정말 어렵습니다. 혼자만의 일이 아니에요 — 연구에 따르면 박사 과정생의 40%가 지도교수 관계를 가장 큰 스트레스 원인으로 꼽아요.\n\n다른 사람들에게 도움이 된 방법들:\n• 직접 작성한 아젠다로 정기 1:1 미팅 요청하기\n• 랩 밖의 동료 멘토 찾기\n• 옴부즈 오피스 — 완전 비밀 보장`,
          resource: { title: "Stanford 옴부즈 오피스", desc: "무료 · 비밀 보장 갈등 조정 · ombuds.stanford.edu" }
        }
      ]
    },
    imposter: {
      keywords: ['임포스터', '자격', '여기 있으면 안', '나만 모르는', '사기꾼', '운으로', '가짜', '부족해', '못 따라가'],
      replies: [
        {
          text: `지금 느끼는 감정에는 이름이 있어요 — '임포스터 신드롬'이에요. 최상위 대학의 박사 과정생 70% 이상이 경험해요. 이 감정이 든다는 게 실력과는 아무 관계가 없어요.\n\n지금 이 감정을 촉발한 게 뭔지 얘기해줄 수 있어요?`,
          qr: ["시험이나 마일스톤에서 실패했어요", "다른 동료들이 훨씬 똑똑해 보여요", "교수님이 제 연구를 의심했어요", "운 좋게 들어온 것 같아요"]
        },
        {
          text: `한번 이렇게 생각해보세요: **스탠퍼드가 당신을 뽑은 건 진짜 근거가 있었기 때문이에요.** 입학 심사위원회는 동정으로 합격시키지 않아요.\n\n임포스터 신드롬은 남의 겉모습과 내 속마음을 비교할 때 가장 심해져요. 똑같은 감정을 느끼는 친구에게 뭐라고 해줄 것 같아요?`,
        }
      ]
    },
    burnout: {
      keywords: ['번아웃', '지쳤어', '의욕이', '못하겠어', '너무 피곤', '탈진', '의미없어', '아무것도 하기 싫', '공부하기 싫'],
      replies: [
        {
          text: `번아웃은 진짜예요, 그리고 심각한 신호예요. 게으른 게 아니에요 — 당신의 신경계가 "뭔가 바뀌어야 해"라고 말하는 거예요.\n\n1점에서 10점 사이로, 지금 얼마나 소진된 느낌인가요?`,
          qr: ["텅 빈 느낌이에요 (9–10점)", "많이 낮아요 (7–8점)", "중간 정도예요 (5–6점)", "슬슬 오는 것 같아요 (3–4점)"]
        },
        {
          text: `번아웃 상태에서는 더 열심히 하려는 충동이 들지만, 그러면 보통 더 나빠져요.\n\n실제로 도움이 되는 작은 세 가지:\n\n1. **나만을 위한 한 시간** 지키기 — 죄책감 없이\n2. **연구에서 설레었던 순간** 하나 떠올리기\n3. **누군가에게 털어놓기** — CAPS에 이번 주 예약 가능해요`,
          resource: { title: "Stanford CAPS — 당주 예약 가능", desc: "wellness.stanford.edu · (650) 723-4357" }
        }
      ]
    },
    lonely: {
      keywords: ['외로워', '고립', '혼자', '친구가 없', '연결이 안', '아무도', '소외', '어울리지 못', '대화할 사람'],
      replies: [
        {
          text: `대학원에서의 고립감은 대부분의 사람들이 인정하는 것보다 훨씬 흔해요 — 모두가 바쁘고, 모두가 스트레스받고, 솔직해지는 게 무섭게 느껴지거든요.\n\n이런 감정이 든 지 얼마나 됐어요?`,
          qr: ["최근 몇 주 사이에요", "올해 내내 그랬어요", "입학하고 나서부터예요", "왔다 갔다 해요"]
        },
        {
          text: `대학원의 외로움은 눈에 잘 안 보여요. 수백 명에 둘러싸여 있으면서도 깊이 단절된 느낌 — 그 대비가 더 아프죠.\n\n해볼 만한 것들:\n• **학과 동기 모임** — 부담 없는 연결\n• **The Bridge 동료 상담** — 같은 학생들이 운영, 매일 밤 9시–1시\n• **Hume 라이팅 센터** — 혼자 말고 같이 작업\n• 랩 밖 누군가와 커피 한 잔`,
          resource: { title: "The Bridge 동료 상담", desc: "학생 자원봉사 운영 · 무료 · bridgepeer.stanford.edu · 오후 9시–새벽 1시" }
        }
      ]
    },
    dissertation: {
      keywords: ['논문', '디서테이션', '쿼릭', '제안서', '글이 안', '막혀', '미루고', '글을 못', '라이팅', '연구 방향', '위원회'],
      replies: [
        {
          text: `논문 불안은 거의 모든 대학원생이 겪어요 — 기대치는 높고, 일정은 불명확하고, 외롭게 하는 작업이거든요.\n\n지금 가장 큰 막힘이 뭐예요? 글쓰기, 연구 방향, 평가받는 게 두려운 것, 아니면 다른 무언가인가요?`,
          qr: ["글 쓰기 시작을 못 하겠어요", "내 연구가 가치 없는 것 같아요", "위원회 교수님들이 까다로워요", "끝이 보이지 않아요"]
        },
        {
          text: `논문 마라톤은 인간이 하는 가장 힘든 일 중 하나예요. 도움이 된 관점 전환들:\n\n📌 **완벽한 것보다 완성된 것** — 당신 역할은 마스터피스가 아닌 완성이에요\n📌 **15분도 충분해요** — 긴 세션보다 꾸준한 흐름이 중요해요\n📌 **위원회는 당신 성공을 원해요** — 그 분들은 당신보다 더 엉망인 초고도 봤어요\n\n구체적으로 어디서 막혔는지 같이 얘기해볼까요?`,
        }
      ]
    },
    crisis: {
      keywords: ['죽고 싶', '자살', '살기 싫', '끝내고 싶', '못 살겠', '해치고 싶', '희망이 없', '방법이 없', '사라지고 싶'],
      replies: [
        {
          text: `지금 이야기해줘서 정말 다행이에요. 느끼는 감정이 심각하다는 걸 알고 있어요 — 챗봇이 아닌 진짜 사람의 도움이 필요해요.\n\n**지금 바로 연락해주세요:**\n• 🆘 전화/문자 **988** (자살예방상담전화)\n• 📞 Stanford CAPS 긴급 라인: **(650) 723-4357**\n• 🏥 Vaden Health Center, 24시간\n\n당신은 소중한 사람이에요. 지금은 느끼지 못해도, 이 고통은 일시적이에요.`,
          isCrisis: true
        }
      ]
    },
    general: [
      `그 말, 들었어요. 어떤 상황인지 좀 더 얘기해줄 수 있어요? 전체 그림을 이해하고 싶어요.`,
      `정말 힘들었겠다. 많은 걸 감당하고 있네요. 지금 가장 먼저 다루고 싶은 게 뭐예요?`,
      `털어놓아줘서 고마워요. 이 감정을 말로 꺼내는 게 용기 있는 일이에요. 그냥 얘기하고 싶은지, 아니면 도움이 될 자료도 같이 찾아볼지 — 어떤 게 더 좋을 것 같아요?`,
      `대학원은 정말로 인간이 경험하는 가장 힘든 것 중 하나예요. 지금 여기서 자신을 돌아보고 있다는 것 자체가 의미 있어요. 요즘 가장 마음에 걸리는 게 뭐예요?`,
    ]
  };

  let responseCounters = {};
  let conversationHistory = [];
  let crisisShown = false;

  function getResponse(input) {
    const lower = input.toLowerCase();

    // Crisis check first
    if (RESPONSES.crisis.keywords.some(k => lower.includes(k))) {
      showCrisis();
      return RESPONSES.crisis.replies[0];
    }

    for (const [key, data] of Object.entries(RESPONSES)) {
      if (key === 'crisis' || key === 'general') continue;
      if (data.keywords.some(k => lower.includes(k))) {
        const idx = (responseCounters[key] || 0) % data.replies.length;
        responseCounters[key] = idx + 1;
        return data.replies[idx];
      }
    }

    // General fallback
    const idx = conversationHistory.length % RESPONSES.general.length;
    return { text: RESPONSES.general[idx] };
  }

  // ── UI Helpers ───────────────────────────────────────────────────────────

  function now() {
    return new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  }

  function buildBotBubble(reply) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-row bot';

    let resourceHTML = '';
    if (reply.resource) {
      resourceHTML = `<div class="resource-card">
        <strong>📌 ${reply.resource.title}</strong>
        <span>${reply.resource.desc}</span>
      </div>`;
    }

    wrap.innerHTML = `
      <div class="msg-avatar">🌉</div>
      <div>
        <div class="msg-bubble">${reply.text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}${resourceHTML}</div>
        <span class="msg-time">${now()}</span>
      </div>`;
    return wrap;
  }

  function buildQR(options) {
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = opt;
      btn.onclick = () => quickReply(opt);
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function appendUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div>
        <div class="msg-bubble">${text.replace(/</g,'&lt;')}</div>
        <span class="msg-time">${now()}</span>
      </div>`;
    chat().appendChild(row);
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typingIndicator';
    el.innerHTML = `<div class="msg-avatar">🌉</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>`;
    chat().appendChild(el);
    scrollBottom();
    return el;
  }

  function chat() { return document.getElementById('chatWindow'); }
  function scrollBottom() {
    const c = chat();
    setTimeout(() => c.scrollTop = c.scrollHeight, 50);
  }

  // ── Core Actions ─────────────────────────────────────────────────────────

  function sendMessage(text) {
    const input = document.getElementById('userInput');
    const msg = (text || input.value).trim();
    if (!msg) return;

    // Remove initial quick replies
    document.getElementById('initialQR')?.remove();

    input.value = '';
    autoResize(input);
    appendUserMsg(msg);
    conversationHistory.push({ role: 'user', text: msg });
    scrollBottom();

    const typing = showTyping();
    const delay = 900 + Math.random() * 700;

    setTimeout(() => {
      typing.remove();
      const reply = getResponse(msg);
      const bubble = buildBotBubble(reply);
      chat().appendChild(bubble);

      if (reply.qr) {
        chat().appendChild(buildQR(reply.qr));
      }
      scrollBottom();
    }, delay);
  }

  function quickReply(text) {
    // Remove all quick reply bars
    document.querySelectorAll('.quick-replies').forEach(el => el.remove());
    sendMessage(text);
  }

  function selectMood(btn, mood) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quickReply(`지금 ${mood} 느낌이에요`);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function showResources() {
    const reply = {
      text: `스탠퍼드 대학원생을 위한 주요 지원 자료입니다:\n\n**🧠 정신건강**\n• CAPS (상담·심리 서비스): (650) 723-4357\n• The Bridge 동료 상담: 매일 밤 9시–새벽 1시\n\n**📚 학업 지원**\n• Hume 라이팅 센터: 무료 상담\n• 대학원 학사 프로그램: gaps.stanford.edu\n\n**💛 커뮤니티**\n• GSC (대학원 학생회): 각종 행사·모임\n• 대학원 생활 지원실: glo.stanford.edu\n\n**🆘 위기 상황**\n• 988 자살예방상담전화 (전화/문자)\n• Vaden Health Center: 24시간 긴급 진료`,
    };
    document.querySelectorAll('.quick-replies').forEach(el => el.remove());
    chat().appendChild(buildBotBubble(reply));
    scrollBottom();
  }

  function showCrisis() {
    document.getElementById('crisisBanner').style.display = 'flex';
  }

  scrollBottom();
</script>
</body>
</html>
