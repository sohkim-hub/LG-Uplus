<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 피드백 보드</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #e0e7ff;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(99, 102, 241, 0.10);
      --shadow-card: 0 2px 12px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
      color: white;
      padding: 48px 24px 40px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    header p {
      font-size: 1rem;
      opacity: 0.88;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Layout ── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── Form Card ── */
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 48px;
    }
    .form-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 24px;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.97rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      background: white;
    }
    textarea { resize: vertical; min-height: 96px; }

    /* Star Rating */
    .star-group {
      display: flex;
      gap: 6px;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    .star-group input { display: none; }
    .star-group label {
      font-size: 2rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: color 0.15s, transform 0.15s;
      text-transform: none;
      letter-spacing: 0;
      padding: 0;
      margin: 0;
    }
    .star-group label:hover,
    .star-group label:hover ~ label,
    .star-group input:checked ~ label {
      color: #f59e0b;
    }
    .star-group label:hover { transform: scale(1.2); }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    }
    .btn-submit:active { transform: translateY(0); }

    /* ── Feedback List ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .list-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .badge {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    /* Feedback Card */
    .feedback-list { display: flex; flex-direction: column; gap: 16px; }

    .feedback-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 26px;
      box-shadow: var(--shadow-card);
      border-left: 4px solid var(--primary);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-name {
      font-weight: 700;
      font-size: 1rem;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .card-stars { color: #f59e0b; font-size: 1.05rem; letter-spacing: 1px; }
    .card-date { font-size: 0.75rem; color: var(--muted); }
    .card-message {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.65;
    }
    .btn-delete {
      float: right;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-delete:hover { color: #ef4444; background: #fee2e2; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 520px) {
      .form-card { padding: 24px 18px; }
      .card-top { flex-direction: column; }
      .card-meta { align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <h1>💬 고객 피드백 보드</h1>
  <p>소중한 의견을 남겨주세요. 더 나은 서비스를 만드는 데 큰 도움이 됩니다.</p>
</header>

<main>

  <!-- 입력 폼 -->
  <div class="form-card">
    <h2>✍️ 피드백 남기기</h2>
    <form id="feedbackForm">

      <div class="field">
        <label for="nameInput">이름</label>
        <input type="text" id="nameInput" placeholder="홍길동" maxlength="30" required />
      </div>

      <div class="field">
        <label>별점</label>
        <div class="star-group" id="starGroup">
          <input type="radio" name="rating" id="s5" value="5" required />
          <label for="s5" title="5점">★</label>
          <input type="radio" name="rating" id="s4" value="4" />
          <label for="s4" title="4점">★</label>
          <input type="radio" name="rating" id="s3" value="3" />
          <label for="s3" title="3점">★</label>
          <input type="radio" name="rating" id="s2" value="2" />
          <label for="s2" title="2점">★</label>
          <input type="radio" name="rating" id="s1" value="1" />
          <label for="s1" title="1점">★</label>
        </div>
      </div>

      <div class="field">
        <label for="messageInput">메시지</label>
        <textarea id="messageInput" placeholder="경험하신 내용을 자유롭게 작성해 주세요." maxlength="500" required></textarea>
      </div>

      <button type="submit" class="btn-submit">피드백 제출하기 →</button>
    </form>
  </div>

  <!-- 목록 -->
  <div class="list-header">
    <h2>📋 피드백 목록</h2>
    <span class="badge" id="countBadge">0개</span>
  </div>
  <div id="feedbackList"></div>

</main>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'feedback_items';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function stars(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function renderList() {
    const items = load();
    const container = document.getElementById('feedbackList');
    document.getElementById('countBadge').textContent = items.length + '개';

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>아직 등록된 피드백이 없어요.<br>첫 번째 의견을 남겨보세요!</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="feedback-list">${
      [...items].reverse().map((item, idx) => `
        <div class="feedback-card">
          <div class="card-top">
            <span class="card-name">${escHtml(item.name)}</span>
            <div class="card-meta">
              <span class="card-stars">${stars(item.rating)}</span>
              <span class="card-date">${formatDate(item.date)}</span>
            </div>
          </div>
          <p class="card-message">${escHtml(item.message)}</p>
          <button class="btn-delete" onclick="deleteItem(${items.length - 1 - idx})" title="삭제">✕</button>
        </div>
      `).join('')
    }</div>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function deleteItem(index) {
    const items = load();
    items.splice(index, 1);
    save(items);
    renderList();
    showToast('피드백이 삭제되었어요.');
  }

  document.getElementById('feedbackForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name    = document.getElementById('nameInput').value.trim();
    const rating  = parseInt(document.querySelector('input[name="rating"]:checked')?.value);
    const message = document.getElementById('messageInput').value.trim();

    if (!name || !rating || !message) return;

    const items = load();
    items.push({ name, rating, message, date: new Date().toISOString() });
    save(items);
    renderList();

    this.reset();
    showToast('🎉 피드백이 등록되었어요!');
  });

  // 초기 렌더링
  renderList();
</script>
</body>
</html>
